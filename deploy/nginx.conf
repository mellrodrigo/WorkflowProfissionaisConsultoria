# nginx — proxy reverso com TLS para a aplicação Node.
# Instalar em: /etc/nginx/sites-available/workflow-ntt
# Substitua SEU_DOMINIO pelo domínio real antes de usar.
#
# O bloco 443 abaixo é criado/ajustado automaticamente pelo certbot.
# Se for rodar o certbot, comece apenas com o bloco 80 e deixe que ele complete.

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # Redireciona tudo para HTTPS (o certbot costuma adicionar isto sozinho).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;

    # Uploads de currículos e emails: o limite do app é 25 MB por arquivo.
    client_max_body_size 30M;

    # Cabeçalhos de segurança.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # A porta precisa acompanhar a variável PORT do serviço (padrão 4000).
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Necessário para o cookie Secure e para o IP real no freio de login.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }
}
