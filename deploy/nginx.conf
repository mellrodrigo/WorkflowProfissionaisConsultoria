# nginx — proxy reverso com TLS para a aplicação Node.
# Domínio: iadasilva.com.br
# Instalar em: /etc/nginx/sites-available/workflow-ntt
#
# Ordem recomendada:
#   1. Suba apenas o bloco 80 (comente os dois blocos 443)
#   2. Rode: certbot --nginx -d iadasilva.com.br -d www.iadasilva.com.br
#   3. Descomente os blocos 443 e recarregue o nginx
#
# O acesso canônico é https://iadasilva.com.br — o www redireciona para lá, de
# modo que a sessão de login não fique dividida entre dois endereços.

# HTTP: tudo vai para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name iadasilva.com.br www.iadasilva.com.br;

    # O certbot precisa deste caminho para validar o domínio.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://iadasilva.com.br$request_uri;
    }
}

# HTTPS no www: redireciona para o domínio sem www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.iadasilva.com.br;

    ssl_certificate     /etc/letsencrypt/live/iadasilva.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iadasilva.com.br/privkey.pem;

    return 301 https://iadasilva.com.br$request_uri;
}

# HTTPS canônico: serve a aplicação.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name iadasilva.com.br;

    ssl_certificate     /etc/letsencrypt/live/iadasilva.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iadasilva.com.br/privkey.pem;

    # Uploads de currículos e emails: o limite do app é 25 MB por arquivo.
    client_max_body_size 30M;

    # Cabeçalhos de segurança.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # A porta precisa acompanhar a variável PORT do serviço (padrão 4000).
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Necessário para o cookie Secure e para o IP real no freio de login.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }
}
